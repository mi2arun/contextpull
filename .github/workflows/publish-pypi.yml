# PyPI trusted publishing (OIDC): no token stored anywhere.
# One-time setup on pypi.org: Your projects -> Publishing -> add a pending publisher
#   owner: mi2arun  repository: contextpull  workflow: publish-pypi.yml  environment: pypi
# Then: git tag v0.1.0 && git push --tags   (or run this workflow manually)
name: publish-pypi
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv run --with twine python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
