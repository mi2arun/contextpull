name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.10", "3.12"] }
    env:
      UV_PYTHON: ${{ matrix.python }}   # .python-version pins 3.12 locally; the matrix must win here
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run --all-extras python -c "import sys, contextpull.server; print('server import ok on', sys.version.split()[0])"
      - run: uv run --all-extras pytest -q -rs
      - run: uv run --all-extras python conformance/run.py check
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd sdk/typescript && npm ci && npm run build && npm run conformance
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23", cache-dependency-path: sdk/go/go.sum }
      - run: cmp tools.json sdk/go/tools.json   # the embedded tool contract must match the repo root
      - run: cd sdk/go && go vet ./... && go build ./... && go run ./cmd/contextpull-conformance ../../conformance/store.sqlite ../../conformance/cases.json
