name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra mcp --extra pdf --python ${{ matrix.python }}
      - run: uv run python -c "import contextpull.server; print('server import ok')"
      - run: uv run pytest -q -rs
      - run: uv run python conformance/run.py check
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd sdk/typescript && npm ci && npm run build && npm run conformance
